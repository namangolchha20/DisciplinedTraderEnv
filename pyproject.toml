[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disciplined_trader_env"
version = "1.0.0"
description = "Multi-timeframe trading environment with GRPO-trained LLM agent and live web terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Disciplined Trader Team"}]
dependencies = [
    "pydantic>=2.0",
    "openenv-core>=0.2.0",
    "fastapi",
    "uvicorn",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
ml = [
    "torch",
    "transformers",
    "accelerate",
    "peft",
    "bitsandbytes",
    "datasets",
    "trl",
    "unsloth",
    "matplotlib",
]

[project.scripts]
server = "server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["env", "server"]
